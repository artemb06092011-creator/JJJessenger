    .flex-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .input-field {
      width: 100%;
      padding: 14px 18px;
      border-radius: 60px;
      font-size: 16px;
      outline: none;
      margin: 10px 0;
      transition: background 0.3s ease, border 0.3s ease, color 0.3s ease;
    }
    .btn-primary {
      border: none;
      border-radius: 60px;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-secondary {
      background: transparent;
      border-radius: 60px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .avatar {

      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 24px;
      color: #fff;
    }
    .avatar-small {
      width: 40px;
      height: 40px;
      border-radius: 40px;
      object-fit: cover;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 18px;
      color: #fff;
    }
    .avatar-large {
      width: 100px;
      height: 100px;
      border-radius: 60px;
      object-fit: cover;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 36px;
      color: #fff;
    }
    body:not(.light) .avatar,
    body:not(.light) .avatar-small,
    body:not(.light) .avatar-large {
      background: #2d2540;
    }
    body.light .avatar,
    body.light .avatar-small,
    body.light .avatar-large {
      background: #d5cec5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0 12px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .round-btn {
      width: 48px;
      height: 48px;
      border-radius: 40px;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s ease;
    }
    .round-btn-back {
      width: 48px;
      height: 48px;
      border-radius: 40px;
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s ease;
    }
    .search-box {
      border-radius: 40px;
      padding: 10px 18px;
      margin: 8px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s ease;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-size: 16px;
    }
    .footer-nav {
      display: flex;
      justify-content: space-around;
      padding: 16px 0 4px;
      margin-top: 20px;
      transition: border 0.3s ease;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
      gap: 4px;
      transition: 0.3s ease;
    }
    .user-item,
    .chat-item {
      padding: 12px 16px;
      border-radius: 24px;
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .chat-item .chat-info {
      flex: 1;
      min-width: 0;
    }
    .chat-item .chat-name {
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-item .chat-last-message {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item .chat-time {
      font-size: 11px;
      white-space: nowrap;
      align-self: flex-start;
      margin-top: 2px;
    }
    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4cd964;
      display: inline-block;
      flex-shrink: 0;
    }
    .unread-badge {
      color: #fff;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .modal-content {
      padding: 28px 24px;
      border-radius: 48px;
      max-width: 400px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .settings-card {
      border-radius: 28px;
      padding: 16px;
      margin: 8px 0;
      transition: background 0.3s ease;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      transition: border 0.3s ease;
    }
    .theme-switch {
      width: 52px;
      height: 28px;
      border-radius: 40px;
      position: relative;
      cursor: pointer;
      transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .theme-switch .thumb {
      width: 22px;
      height: 22px;
      border-radius: 40px;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: #f0e68c;
      box-shadow: 0 0 20px rgba(240, 230, 140, 0.3);
    }
    .empty-state {
      text-align: center;
      padding: 40px 0;
    }
    .empty-state span {
      font-size: 48px;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 500px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 20px;
      word-wrap: break-word;
      animation: messageIn 0.2s ease;
    }
    @keyframes messageIn {
      from {
        transform: scale(0.95);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    .message.sent {
      align-self: flex-end;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message .time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
      display: block;
      text-align: right;
    }
    .chat-input-container {
      display: flex;
      gap: 10px;
      padding-top: 10px;
      transition: border 0.3s ease;
    }
    .chat-input-container input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 60px;
      font-size: 16px;
      outline: none;
      transition: background 0.3s ease, border 0.3s ease, color 0.3s ease;
    }
    .chat-input-container input:focus {
      border-color: #e87a4b;
    }
    .chat-input-container button {
      padding: 12px 24px;
      border-radius: 60px;
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .chat-input-container button:hover {
      transform: scale(0.97);

      padding-bottom: 12px;
      margin-bottom: 12px;
      transition: border 0.3s ease;

    .chat-header h2 {
      font-size: 18px;
    }
    .chat-header .status {
      font-size: 12px;
      color: #4cd964;
    }

      justify-content: center;
      min-height: 400px;
      gap: 20px;

      height: 50px;
      border: 4px solid #3a3a44;
      border-radius: 50%;
      animation: spin 1s linear infinite;

    body:not(.light) .loader-spinner {
      border-color: #2d2540;
    }
    body.light .loader-spinner {
      border-color: #d5cec5;

      0% {
        transform: rotate(0);
      }

        transform: rotate(360deg);
      }

    .loader-text {
      font-size: 16px;

      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 30px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .username-check {
      font-size: 14px;
      margin: 4px 0 12px;
    }
    .green {
      color: #4cd964;
    }
    .red {
      color: #ff6b6b;
    }

    }

      margin: 8px 0;
    }
    .download-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #8b6fe0;
      color: #fff;
      border: none;
      border-radius: 60px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }
    body.light .download-btn {
      background: #e87a4b;
    }
    .download-btn:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }
    .download-btn:active {
      transform: scale(0.95);
    }
    .install-banner {
      margin-top: 8px;
      font-size: 13px;
      color: #8a82a0;
    }
    body.light .install-banner {
      color: #888;
    }
    .theme-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .theme-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .theme-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      transform: scale(0.3);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      background: radial-gradient(circle, #fff9e6, #f5e6c8);
      box-shadow: 0 0 80px rgba(255, 200, 100, 0.6);
    }
    .theme-icon.show {
      transform: scale(1);
      opacity: 1;
    }
    .theme-icon.hide {
      transform: scale(1.5);
      opacity: 0;
    }
    body:not(.light) .theme-icon .sun {
      display: none;
    }
    body:not(.light) .theme-icon .moon {
      display: inline-block;
    }
    body.light .theme-icon .sun {
      display: inline-block;
    }
    body.light .theme-icon .moon {
      display: none;
    }
    body.light .theme-icon {
      background: radial-gradient(circle, #1a1a2e, #0f0f1a);
      box-shadow: 0 0 80px rgba(100, 150, 255, 0.3);
    }
    @media (max-width: 480px) {
      #app {
        padding: 16px;
        min-height: 90vh;
        border-radius: 28px;
      }
      .theme-icon {
        width: 90px;
        height: 90px;
        font-size: 45px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loader-container">
      <div class="loader-spinner"></div>
      <div class="loader-text">Загрузка J Messenger...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'firebase/app';
    import {
      getAuth,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from 'firebase/auth';
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      collection,
      query,
      where,
      getDocs,
      addDoc,
      onSnapshot,
      orderBy,
      serverTimestamp,
      increment
    } from 'firebase/firestore';
    import { getStorage, ref, uploadBytes, getDownloadURL } from 'firebase/storage';

    const firebaseConfig = {
      apiKey: 'AIzaSyBI7VB0zTARMTKEj1tVr_VwzfoQ6bJw0x0',
      authDomain: 'jmessenger-519cf.firebaseapp.com',
      projectId: 'jmessenger-519cf',
      storageBucket: 'jmessenger-519cf.firebasestorage.app',
      messagingSenderId: '339570238049',
      appId: '1:339570238049:web:01d8a317f99314ddefc020',
      measurementId: 'G-YPYR4B4HCV'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser = null;
    let currentUserData = null;
    let currentChatUser = null;
    let chatUnsubscribe = null;
    let chatsUnsubscribe = null;
    let isRegistering = false;
    const appEl = document.getElementById('app');

    function render(html) { appEl.innerHTML = html; }

    // ========== АВАТАРКИ ==========
    function getInitials(name) { return name ? name.charAt(0).toUpperCase() : '?'; }

    function getAvatarColor(uid) {
      const colors = ['#e87a4b', '#4ba3e8', '#4be8b0', '#e84b8a', '#e8d34b', '#8a4be8', '#4be8d3'];
      let hash = 0;
      for (let i = 0; i < uid.length; i++) hash = uid.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    function createAvatarHTML(uid, name, photoURL, size = 'avatar') {
      const sizeClass = size === 'small' ? 'avatar-small' : size === 'large' ? 'avatar-large' : 'avatar';
      const initials = getInitials(name);
      const color = getAvatarColor(uid);
      if (photoURL && photoURL !== '' && photoURL !== 'null' && photoURL !== 'undefined') {
        return `<img src="${photoURL}" class="${sizeClass}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\"${sizeClass}\\" style=\\"background:${color};display:flex;align-items:center;justify-content:center;\\">${initials}</div>'">`;
      }
      return `<div class="${sizeClass}" style="background:${color};display:flex;align-items:center;justify-content:center;">${initials}</div>`;
    }

    // ========== ТЕМА ==========
    function toggleTheme() {
      const isLight = document.body.classList.toggle('light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      const overlay = document.createElement('div');
      overlay.className = 'theme-overlay';
      overlay.innerHTML = `
            <div class="theme-icon">
              <span class="sun">☀️</span>
              <span class="moon">🌙</span>
            </div>
          `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => {
        overlay.classList.add('active');
        const icon = overlay.querySelector('.theme-icon');
        requestAnimationFrame(() => icon.classList.add('show'));
      });
      setTimeout(() => {
        const icon = overlay.querySelector('.theme-icon');
        icon.classList.remove('show');
        icon.classList.add('hide');
        setTimeout(() => {
          overlay.classList.remove('active');
          setTimeout(() => overlay.remove(), 300);
        }, 400);
      }, 800);
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.body.classList.add('light');
      } else {
        document.body.classList.remove('light');
      }
    }

    // ========== ЭКРАН ВХОДА ==========
    function showAuthScreen() {
      let currentTab = 'email';

      function renderAuth() {
        const isEmail = currentTab === 'email';
        render(`
              <div class="flex-center" style="padding:20px 0;">
                <h1 style="font-size:38px;font-weight:800;background:linear-gradient(135deg,#f0935e,#e87a4b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">J Messenger</h1>
                <p style="color:#a0a0b0;margin:6px 0 30px;">Соединяя людей мгновенно</p>
                <div class="auth-tabs">
                  <button class="auth-tab ${isEmail ? 'active' : ''}" id="tabEmail">📧 По ссылке</button>
                  <button class="auth-tab ${!isEmail ? 'active' : ''}" id="tabPassword">🔑 По паролю</button>
                </div>
                ${isEmail ? `
                  <p style="color:#b0b0bc;text-align:center;font-size:14px;max-width:280px;">Введите email, чтобы получить ссылку для входа</p>
                  <p style="color:#7a7a88;font-size:13px;margin-top:6px;">Если письмо не пришло, проверьте папку "Спам"</p>
                  <input id="emailInput" class="input-field" type="email" placeholder="Email" value="">
                  <button id="sendLinkBtn" class="btn-primary" style="margin-top:12px;">Отправить ссылку</button>
                ` : `
                  <p style="color:#b0b0bc;text-align:center;font-size:14px;max-width:280px;">Введите email и пароль для входа</p>
                  <input id="loginEmail" class="input-field" type="email" placeholder="Email" value="">
                  <input id="loginPassword" class="input-field" type="password" placeholder="Пароль" value="">
                  <button id="loginBtn" class="btn-primary" style="margin-top:12px;">Войти</button>
                  <button id="registerBtn" class="btn-secondary" style="margin-top:8px;">Создать аккаунт</button>
                `}
                <div id="authMessage" style="margin-top:16px;color:#ff6b6b;font-size:14px;text-align:center;"></div>
              </div>
            `);

        document.getElementById('tabEmail')?.addEventListener('click', () => { currentTab = 'email';
          renderAuth(); });
        document.getElementById('tabPassword')?.addEventListener('click', () => { currentTab = 'password';
          renderAuth(); });

        document.getElementById('sendLinkBtn')?.addEventListener('click', async () => {
          const email = document.getElementById('emailInput').value.trim();
          const msg = document.getElementById('authMessage');
          if (!email) { msg.textContent = 'Введите email'; return; }
          try {
            await sendSignInLinkToEmail(auth, email, { url: window.location.href, handleCodeInApp: true });
            localStorage.setItem('emailForSignIn', email);
            showEmailSentScreen(email);
          } catch (e) {
            if (e.code === 'auth/quota-exceeded') {
              msg.textContent = '⚠️ Лимит писем на сегодня. Используйте вход по паролю (вкладка "По паролю")';
            } else {
              msg.textContent = 'Ошибка: ' + e.message;
            }
          }
        });

        document.getElementById('loginBtn')?.addEventListener('click', async () => {
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value;
          const msg = document.getElementById('authMessage');
          if (!email || !password) { msg.textContent = 'Заполните все поля'; return; }
          try {
            await signInWithEmailAndPassword(auth, email, password);
          } catch (e) {
            if (e.code === 'auth/user-not-found') {
              msg.textContent = '❌ Пользователь не найден. Нажмите "Создать аккаунт"';
            } else if (e.code === 'auth/wrong-password') {
              msg.textContent = '❌ Неверный пароль';
            } else {
              msg.textContent = 'Ошибка: ' + e.message;
            }
          }
        });

        document.getElementById('registerBtn')?.addEventListener('click', async () => {
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value;
          const msg = document.getElementById('authMessage');
          if (!email || !password) { msg.textContent = 'Заполните все поля'; return; }
          if (password.length < 6) { msg.textContent = 'Пароль должен быть минимум 6 символов'; return; }
          try {
            isRegistering = true;
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            currentUser = userCred.user;
            showProfileSetup();
          } catch (e) {
            isRegistering = false;
            if (e.code === 'auth/email-already-in-use') {
              msg.textContent = '❌ Этот email уже используется. Нажмите "Войти"';
            } else {
              msg.textContent = 'Ошибка: ' + e.message;
            }
          }
        });
      }
      renderAuth();
    }

    function showEmailSentScreen(email) {
      render(`
            <div class="flex-center" style="padding:40px 0;">
              <span style="font-size:72px;">📨</span>
              <h2 style="margin:20px 0 10px;">Письмо отправлено</h2>
              <p style="text-align:center;color:#b0b0bc;">Мы отправили ссылку на <strong>${email}</strong></p>
              <p style="text-align:center;color:#8e8e9a;margin-top:10px;">Откройте письмо и перейдите по ссылке.<br>После подтверждения вход произойдёт автоматически.</p>
              <button class="btn-secondary" style="margin-top:20px;" id="backToAuth">← Назад</button>
            </div>
          `);
      document.getElementById('backToAuth').addEventListener('click', showAuthScreen);
    }

    // ========== СОЗДАНИЕ ПРОФИЛЯ ==========
    function showProfileSetup() {
      render(`
            <div class="flex-center" style="padding:8px 0;">
              <h2 style="margin-bottom:16px;">Создание профиля</h2>
              <input id="profileName" class="input-field" placeholder="Имя" value="">
              <input id="profileUsername" class="input-field" placeholder="Username" value="">
              <div id="usernameCheck" class="username-check">Username должен быть уникальным.</div>
              <button id="createProfileBtn" class="btn-primary" style="margin-top:8px;">Создать профиль</button>
              <div id="profileError" style="color:#ff6b6b;margin-top:12px;"></div>
            </div>
          `);
      const usernameInput = document.getElementById('profileUsername');
      const checkDiv = document.getElementById('usernameCheck');
      let usernameAvailable = false;

      usernameInput.addEventListener('input', async () => {
        const val = usernameInput.value.trim();
        if (val.length < 3) { checkDiv.innerHTML = 'Username должен быть уникальным.'; return; }
        try {
          const q = query(collection(db, 'users'), where('username', '==', val));
          const snap = await getDocs(q);
          if (!snap.empty) {
            checkDiv.innerHTML = '🔴 Username уже занят';
            usernameAvailable = false;
          } else {
            checkDiv.innerHTML = '🟢 Username свободен';
            usernameAvailable = true;
          }
        } catch (e) { checkDiv.innerHTML = 'Ошибка проверки'; }
      });

      document.getElementById('createProfileBtn').addEventListener('click', async () => {
        const name = document.getElementById('profileName').value.trim();
        const username = document.getElementById('profileUsername').value.trim();
        if (!name || !username) { document.getElementById('profileError').textContent = 'Заполните все поля'; return; }
        if (!usernameAvailable) { document.getElementById('profileError').textContent = 'Username занят или не проверен'; return; }
        if (!currentUser) return;
        try {
          await setDoc(doc(db, 'users', currentUser.uid), {
            uid: currentUser.uid,
            name,
            username,
            photo: '',
            createdAt: serverTimestamp()
          });
          currentUserData = { name, username, photo: '' };
          isRegistering = false;
          showMainScreen();
        } catch (e) {
          document.getElementById('profileError').textContent = 'Ошибка: ' + e.message;
        }
      });
    }

    // ========== ГЛАВНЫЙ ЭКРАН ==========
    function showMainScreen() {
      if (chatUnsubscribe) { chatUnsubscribe();
        chatUnsubscribe = null; }
      if (chatsUnsubscribe) { chatsUnsubscribe();
        chatsUnsubscribe = null; }
      currentChatUser = null;
      render(`
            <div>
              <div class="header"><h1>J Messenger</h1></div>
              <div class="search-box"><span>🔍</span><input id="globalSearch" placeholder="Поиск пользователей..." /></div>
              <div id="chatList"><div class="empty-state"><span>😔</span><p>Пока тут никого нет</p><p style="font-size:14px;">Найдите кого-то, чтобы начать общение 💬</p></div></div>
              <div class="footer-nav"><div class="nav-item active" id="navChats">💬 Чаты</div><div class="nav-item" id="navSettings">⚙️ Настройки</div></div>
            </div>
          `);
      loadChatList();

      document.getElementById('globalSearch').addEventListener('input', async (e) => {
        const q = e.target.value.trim();
        if (q.length < 2) { loadChatList(); return; }
        try {
          const qSnap = await getDocs(query(collection(db, 'users'), where('username', '>=', q), where(
            'username', '<=', q + '\uf8ff')));
          let html = '';
          qSnap.forEach(d => {
            const data = d.data();
            if (data.uid === currentUser.uid) return;
            html += `
                        <div class="user-item" data-uid="${data.uid}" data-name="${data.name}" data-username="${data.username}" data-photo="${data.photo || ''}">
                          ${createAvatarHTML(data.uid, data.name, data.photo)}
                          <div><strong>${data.name}</strong> <span style="color:#8a82a0;">@${data.username}</span></div>
                        </div>
                      `;
          });
          document.getElementById('chatList').innerHTML = html || '<div class="empty-state">Никого не найдено</div>';
          document.querySelectorAll('.user-item').forEach(el => {
            el.addEventListener('click', () => {
              openPrivateChat(el.dataset.uid, el.dataset.name, el.dataset.username, el.dataset.photo);
            });
          });
        } catch (e) { console.error(e); }
      });

      document.getElementById('navSettings').addEventListener('click', showSettingsScreen);
      document.getElementById('navChats').addEventListener('click', () => {
        document.getElementById('globalSearch').value = '';
        loadChatList();
      });
    }

    // ============================================================
    // ЗАГРУЗКА СПИСКА ЧАТОВ
    // ============================================================
    function loadChatList() {
      const chatListEl = document.getElementById('chatList');
      if (!chatListEl) return;

      if (chatsUnsubscribe) { chatsUnsubscribe();
        chatsUnsubscribe = null; }

      const q = query(collection(db, 'chats'), where('members', 'array-contains', currentUser.uid));

      chatsUnsubscribe = onSnapshot(q, async (snapshot) => {
        if (snapshot.empty) {
          chatListEl.innerHTML =
            `<div class="empty-state"><span>😔</span><p>Пока тут никого нет</p><p style="font-size:14px;">Найдите кого-то, чтобы начать общение 💬</p></div>`;
          return;
        }

        const chatData = [];
        for (const d of snapshot.docs) {
          const data = d.data();
          const chatId = d.id;
          const otherUid = data.members.find(m => m !== currentUser.uid);
          if (!otherUid) continue;

          try {
            const userDoc = await getDoc(doc(db, 'users', otherUid));
            if (!userDoc.exists()) continue;
            const userData = userDoc.data();

            const lastMessage = data.lastMessage || 'Нет сообщений';
            const lastMessageTime = data.lastMessageTime || null;
            const lastSender = data.lastSender || null;
            const unreadCount = data.unreadCounts?.[currentUser.uid] || 0;

            chatData.push({ chatId, otherUid, userData, lastMessage, lastMessageTime, lastSender,
              unreadCount });
          } catch (e) { console.error(e); }
        }

        chatData.sort((a, b) => {
          if (!a.lastMessageTime) return 1;
          if (!b.lastMessageTime) return -1;
          return b.lastMessageTime.seconds - a.lastMessageTime.seconds;
        });

        let html = '';
        for (const chat of chatData) {
          const time = chat.lastMessageTime ? new Date(chat.lastMessageTime.seconds * 1000).toLocaleTimeString(
            [], { hour: '2-digit', minute: '2-digit' }) : '';
          const isFromMe = chat.lastSender === currentUser.uid;
          const preview = isFromMe ? `Вы: ${chat.lastMessage}` : chat.lastMessage;
          const unreadBadge = chat.unreadCount > 0 ? `<span class="unread-badge">${chat.unreadCount}</span>` :
            '';

          html += `
                      <div class="chat-item" data-uid="${chat.otherUid}" data-name="${chat.userData.name}" data-username="${chat.userData.username}" data-photo="${chat.userData.photo || ''}">
                        ${createAvatarHTML(chat.otherUid, chat.userData.name, chat.userData.photo, 'small')}
                        <div class="chat-info">
                          <div class="chat-name">
                            ${chat.userData.name}
                            <span class="online-dot"></span>
                            ${unreadBadge}
                          </div>
                          <div class="chat-last-message">${preview}</div>
                        </div>
                        <div class="chat-time">${time}</div>
                      </div>
                    `;
        }
        chatListEl.innerHTML = html;

        document.querySelectorAll('.chat-item').forEach(el => {
          el.addEventListener('click', () => {
            const uid = el.dataset.uid;
            const name = el.dataset.name;
            const username = el.dataset.username;
            const photo = el.dataset.photo;
            openPrivateChat(uid, name, username, photo);
          });
        });
      });
    }

    // ============================================================
    // ОБНУЛЕНИЕ СЧЁТЧИКА
    // ============================================================
    async function resetUnreadCounter(chatId) {
      try {
        const ref = doc(db, 'chats', chatId);
        const updateData = {};
        updateData[`unreadCounts.${currentUser.uid}`] = 0;
        await updateDoc(ref, updateData);
        loadChatList();
      } catch (e) {
        console.error('Ошибка обнуления счётчика:', e);
      }
    }

    // ============================================================
    // ЛИЧНЫЙ ЧАТ
    // ============================================================
    function openPrivateChat(otherUid, otherName, otherUsername, otherPhoto) {
      if (chatUnsubscribe) { chatUnsubscribe();
        chatUnsubscribe = null; }
      currentChatUser = { uid: otherUid, name: otherName, username: otherUsername, photo: otherPhoto };
      const chatId = [currentUser.uid, otherUid].sort().join('_');

      // === ОБНУЛЯЕМ СЧЁТЧИК ===
      resetUnreadCounter(chatId);

      render(`
            <div>
              <div class="chat-header">
                <button class="round-btn-back" id="backFromChat">←</button>
                <div id="chatAvatarContainer">${createAvatarHTML(otherUid, otherName, otherPhoto, 'small')}</div>
                <div><h2>${otherName}</h2><span class="status">● @${otherUsername}</span></div>
              </div>
              <div class="chat-container">
                <div class="chat-messages" id="chatMessages"><div style="text-align:center;color:#8a82a0;padding:20px;">Загрузка...</div></div>
                <div class="chat-input-container"><input id="messageInput" placeholder="Сообщение..." /><button id="sendMessageBtn">📤</button></div>
              </div>
            </div>
          `);

      document.getElementById('backFromChat').addEventListener('click', () => {
        if (chatUnsubscribe) { chatUnsubscribe();
          chatUnsubscribe = null; }
        loadChatList();
        showMainScreen();
      });

      const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt'));
      chatUnsubscribe = onSnapshot(q, (snapshot) => {
        const div = document.getElementById('chatMessages');
        if (!div) return;
        let html = '';
        snapshot.forEach(d => {
          const data = d.data();
          const isSent = data.senderId === currentUser.uid;
          const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([],
            { hour: '2-digit', minute: '2-digit' }) : '';
          html += `
                        <div class="message ${isSent ? 'sent' : 'received'}">
                          ${data.text}
                          <span class="time">${time}</span>
                        </div>
                      `;
        });
        div.innerHTML = html ||
          '<div style="text-align:center;color:#8a82a0;padding:20px;">Нет сообщений. Напишите первым! 💬</div>';
        div.scrollTop = div.scrollHeight;
        markMessagesAsRead(chatId);
      });

      document.getElementById('sendMessageBtn').addEventListener('click', sendMessage);
      document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter')
          sendMessage(); });
    }

    // ============================================================
    // ОТПРАВКА СООБЩЕНИЯ
    // ============================================================
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentChatUser) return;
      const chatId = [currentUser.uid, currentChatUser.uid].sort().join('_');

      try {
        await addDoc(collection(db, 'chats', chatId, 'messages'), {
          text,
          senderId: currentUser.uid,
          senderName: currentUserData.name,
          read: false,
          createdAt: serverTimestamp()
        });

        const chatRef = doc(db, 'chats', chatId);
        const unreadCounts = {};
        unreadCounts[currentChatUser.uid] = increment(1);

        await setDoc(chatRef, {
          members: [currentUser.uid, currentChatUser.uid],
          lastMessage: text,
          lastMessageTime: serverTimestamp(),
          lastSender: currentUser.uid,
          unreadCounts: unreadCounts,
          createdAt: serverTimestamp()
        }, { merge: true });

        input.value = '';
        loadChatList();

        // === ОТПРАВЛЯЕМ УВЕДОМЛЕНИЕ В TELEGRAM ===
        sendTelegramNotification(currentChatUser.uid, currentUserData.name, text);
      } catch (e) { alert('Ошибка: ' + e.message); }
    }

    // ============================================================
    // ОТМЕТКА ПРОЧИТАННЫХ
    // ============================================================
    async function markMessagesAsRead(chatId) {
      try {
        const messagesRef = collection(db, 'chats', chatId, 'messages');
        const q = query(messagesRef, where('senderId', '!=', currentUser.uid), where('read', '==', false));
        const snap = await getDocs(q);
        if (snap.empty) return;
        const batch = [];
        snap.forEach(doc => {
          batch.push(updateDoc(doc.ref, { read: true }));
        });
        await Promise.all(batch);
        loadChatList();
      } catch (e) { console.error('Ошибка отметки прочитанных:', e); }
    }

    // ============================================================
    // TELEGRAM УВЕДОМЛЕНИЯ
    // ============================================================
    const BOT_TOKEN = '8755472651:AAE7dBrYJJbJeYUSmDvWc5-7o0RMvAJuS68';

    async function sendTelegramNotification(chatUserUid, senderName, messageText) {
      try {
        const userDoc = await getDoc(doc(db, 'users', chatUserUid));
        if (!userDoc.exists()) return;
        const userData = userDoc.data();
        if (!userData.telegramChatId) return;
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: userData.telegramChatId,
            text: `📩 *${senderName}* написал(а):\n\n${messageText}`,
            parse_mode: 'Markdown',
            disable_notification: false
          })
        });
      } catch (e) { console.error('Ошибка отправки в Telegram:', e); }
    }

    // ============================================================
    // СКАЧИВАНИЕ ПОЛНОГО ПРОЕКТА
    // ============================================================
    function downloadFullProject() {
      const fullHtml = document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `J_Messenger_${new Date().toISOString().slice(0,10)}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ============================================================
    // НАСТРОЙКИ
    // ============================================================
    function showSettingsScreen() {
      if (chatUnsubscribe) { chatUnsubscribe();
        chatUnsubscribe = null; }
      if (chatsUnsubscribe) { chatsUnsubscribe();
        chatsUnsubscribe = null; }
      currentChatUser = null;

      const appUrl = window.location.href;
      const isLight = document.body.classList.contains('light');

      render(`
            <div>
              <div class="header">
                <h1>Настройки</h1>
                <button class="round-btn-back" id="backFromSettings">←</button>
              </div>
              <div class="settings-card" style="display:flex;gap:16px;align-items:center;">
                <div id="profilePhotoContainer">${createAvatarHTML(currentUser.uid, currentUserData?.name, currentUserData?.photo, 'large')}</div>
                <div>
                  <strong>${currentUserData?.name || 'Пользователь'}</strong><br>
                  <span style="color:#8a82a0;">@${currentUserData?.username || ''}</span>
                </div>
              </div>
              <div class="settings-card">
                <button id="changePhotoBtn" class="btn-secondary" style="width:100%;margin:6px 0;">📷 Изменить фото</button>
                <button id="changeNameBtn" class="btn-secondary" style="width:100%;margin:6px 0;">✏️ Изменить имя</button>
              </div>
              <div class="settings-card">
                <div class="theme-toggle">
                  <span id="themeLabel">${isLight ? '☀️ Светлая' : '🌙 Тёмная'}</span>
                  <div id="themeSwitch" class="theme-switch">
                    <div class="thumb">${isLight ? '☀️' : '🌙'}</div>
                  </div>
                </div>
              </div>
              <div class="settings-card download-section">
                <h3>📱 Поделиться приложением</h3>
                <div id="qrcode"></div>
                <button id="downloadAppBtn" class="download-btn">Кнопка недоступна⛔️</button>
                <div class="install-banner">
                  📲 Отсканируйте QR-код на телефоне<br>
                  или скачайте файл на компьютер
                </div>
              </div>
              <button id="logoutBtn" class="btn-secondary" style="width:100%;margin-top:16px;color:#ff6b6b;">🚪 Выйти</button>
            </div>
          `);

      document.getElementById('backFromSettings').addEventListener('click', showMainScreen);

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (confirm('Вы уверены?')) {
          if (chatUnsubscribe) { chatUnsubscribe();
            chatUnsubscribe = null; }
          if (chatsUnsubscribe) { chatsUnsubscribe();
            chatsUnsubscribe = null; }
          await signOut(auth);
          currentUser = null;
          currentUserData = null;
          showAuthScreen();
        }
      });

      document.getElementById('themeSwitch').addEventListener('click', () => {
        toggleTheme();
        const isLightNow = document.body.classList.contains('light');
        document.getElementById('themeLabel').textContent = isLightNow ? '☀️ Светлая' : '🌙 Тёмная';
        document.querySelector('#themeSwitch .thumb').textContent = isLightNow ? '☀️' : '🌙';
      });

      document.getElementById('changePhotoBtn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          if (!file.type.startsWith('image/')) {
            alert('❌ Пожалуйста, выберите изображение');
            return;
          }
          if (file.size > 5 * 1024 * 1024) {
            alert('❌ Файл слишком большой (макс. 5 МБ)');
            return;
          }
          const container = document.getElementById('profilePhotoContainer');
          container.innerHTML =
            '<div class="avatar-large" style="background:#3a3a44;display:flex;align-items:center;justify-content:center;">⏳</div>';
          try {
            const fileRef = ref(storage, `profiles/${currentUser.uid}`);
            await uploadBytes(fileRef, file);
            const url = await getDownloadURL(fileRef);
            await updateDoc(doc(db, 'users', currentUser.uid), { photo: url });
            currentUserData.photo = url;
            container.innerHTML = createAvatarHTML(currentUser.uid, currentUserData.name, url, 'large');
            alert('✅ Фото обновлено!');
            loadChatList();
          } catch (err) {
            console.error('Ошибка загрузки фото:', err);
            alert('❌ Ошибка загрузки фото: ' + err.message + '\nПроверьте правила Storage');
            container.innerHTML = createAvatarHTML(currentUser.uid, currentUserData.name, currentUserData
              .photo, 'large');
          }
        };
        input.click();
      });

      document.getElementById('changeNameBtn').addEventListener('click', () => {
        const newName = prompt('Новое имя:', currentUserData?.name || '');
        if (newName?.trim()) {
          updateDoc(doc(db, 'users', currentUser.uid), { name: newName.trim() })
            .then(() => {
              currentUserData.name = newName.trim();
              showSettingsScreen();
              loadChatList();
            })
            .catch(err => alert('Ошибка: ' + err.message));
        }
      });

      // QR-код
      try {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: appUrl,
          width: 160,
          height: 160,
          colorDark: '#1a1528',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
        if (document.body.classList.contains('light')) {
          qrContainer.innerHTML = '';
          new QRCode(qrContainer, {
            text: appUrl,
            width: 160,
            height: 160,
            colorDark: '#1a1a1e',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      } catch (e) {
        document.getElementById('qrcode').innerHTML = '<p style="color:#8a82a0;font-size:12px;">QR-код не загрузился</p>';
      }

      document.getElementById('downloadAppBtn').addEventListener('click', downloadFullProject);

      if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
        const banner = document.querySelector('.install-banner');
        if (banner) {
          banner.innerHTML = `
                      📱 Нажмите "Скачать" → откройте файл<br>
                      или поделитесь ссылкой с друзьями
                    `;
        }
      }
    }

    // ============================================================
    // PWA УСТАНОВКА
    // ============================================================
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    async function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        if (result.outcome === 'accepted') {
          console.log('✅ Приложение установлено!');
        } else {
          console.log('❌ Установка отменена');
        }
        deferredPrompt = null;
      } else {
        alert('📱 Откройте это в браузере Chrome или Safari и добавьте на главный экран');
      }
    }

    // ============================================================
    // АВТОРИЗАЦИЯ
    // ============================================================
    onAuthStateChanged(auth, async (user) => {
      try {
        if (user) {
          currentUser = user;
          const docSnap = await getDoc(doc(db, 'users', user.uid));
          if (docSnap.exists()) {
            currentUserData = docSnap.data();
            showMainScreen();
          } else {
            if (!isRegistering) {
              showProfileSetup();
            }
          }
        } else {
          if (isSignInWithEmailLink(auth, window.location.href)) {
            let email = localStorage.getItem('emailForSignIn');
            if (!email) email = prompt('Введите email для входа');
            if (email) {
              await signInWithEmailLink(auth, email, window.location.href);
              localStorage.removeItem('emailForSignIn');
              window.history.replaceState({}, document.title, window.location.pathname);
            }
          } else {
            showAuthScreen();
          }
        }
      } catch (e) {
        console.error(e);
        showAuthScreen();
      }
    });

    // ============================================================
    // ЗАПУСК
    // ============================================================
    initTheme();
    console.log('🚀 J Messenger запущен. Группы удалены. Только личные чаты.');
    console.log('✅ Счётчик обнуляется, аватарки загружаются.');
  </script>
</body>
</html>
